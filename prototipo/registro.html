<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1e2422">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="data:,">
<title>Despensa · Registro</title>
<style>
:root{
  --ground:#ffffff;--bar:#f6f6f3;--ink:#1b1f1d;--ink-2:#5c6360;--ink-3:#6b726e;
  --rule:rgba(27,31,29,.22);--hair:rgba(27,31,29,.14);
  --tint:#ff9f0a;--tint-ink:#a65200;--on-tint:#1b1f1d;--fill:#1b1f1d;--on-fill:#ffffff;
  --seg:#ecece8;--seg-on:#ffffff;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#1e2422;--bar:#161b19;--ink:#f2f1ec;--ink-2:#a7aea9;--ink-3:#8d9590;
  --rule:rgba(242,241,236,.2);--hair:rgba(242,241,236,.12);
  --tint:#ff9f0a;--tint-ink:#ff9f0a;--on-tint:#161b19;--fill:#f2f1ec;--on-fill:#161b19;
  --seg:#2a312e;--seg-on:#47504c;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#1e2422;--bar:#161b19;--ink:#f2f1ec;--ink-2:#a7aea9;--ink-3:#8d9590;
  --rule:rgba(242,241,236,.2);--hair:rgba(242,241,236,.12);
  --tint:#ff9f0a;--tint-ink:#ff9f0a;--on-tint:#161b19;--fill:#f2f1ec;--on-fill:#161b19;
  --seg:#2a312e;--seg-on:#47504c;
  color-scheme:dark}

*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;background:var(--ground);scrollbar-width:thin;scrollbar-color:var(--rule) transparent}
body{min-height:100dvh;background:var(--ground);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.35;
  font-feature-settings:"tnum" 1;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;caret-color:var(--tint)}
::selection{background:var(--tint);color:var(--on-tint)}
button,input{font:inherit;color:inherit;background:none;border:0}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--tint);outline-offset:3px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

.screen{max-width:440px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 12px) 0 calc(env(safe-area-inset-bottom) + 112px)}
header{padding:24px 20px 0}
h1{font-size:34px;line-height:1.12;font-weight:700;letter-spacing:-.02em}
.sec{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:32px 20px 4px;
  font-size:24px;line-height:1.2;font-weight:700;letter-spacing:-.015em}
.sec small{font-size:13px;font-weight:500;letter-spacing:0;color:var(--ink-2)}
ul{list-style:none}

/* Un día por fila: la fecha a la izquierda, el plato y las dos notas a la derecha
   en dos columnas fijas con su rótulo, como las dos columnas de precio de una carta */
.cols{display:flex;justify-content:flex-end;gap:6px;margin:0 20px;font-size:13px;font-weight:500;color:var(--ink-2)}
.cols span:first-child,.fig i:first-child{width:22px;text-align:right}
.cols span:last-child,.fig i:last-child{width:40px;text-align:right}
.dia{display:grid;grid-template-columns:36px 1fr;column-gap:10px;align-items:start;padding:10px 20px}
.fecha{display:flex;align-items:baseline;gap:4px}
.fecha b{width:12px;font-size:13px;font-weight:600;color:var(--ink-2)}
.fecha span{font-size:17px;font-weight:600}
.fecha.on span{color:var(--tint-ink)}
.hoy .fecha{gap:8px;margin-top:4px}
.hoy .cuerpo{padding-left:6px}
.hoy .fecha span{display:inline-grid;place-items:center;width:28px;height:28px;margin:-3px -5px;border-radius:50%;font-size:15px;box-shadow:inset 0 0 0 2px var(--ink)}
.cuerpo{min-width:0}
.line{display:flex;align-items:baseline;align-items:last baseline;gap:8px}
.name{min-width:0;text-wrap:balance}
.hoy .name{font-size:19px;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
.leader{position:relative;flex:1;min-width:32px;transform:translateY(-5px)}
.leader::before{content:"";position:absolute;left:calc(-1 * var(--ext, 0px));right:0;bottom:-2px;border-bottom:2px dotted var(--rule)}
.fig{display:flex;gap:6px;font-weight:600;white-space:nowrap}
.fig i{font-style:normal}
.fig i.no{color:var(--ink-3);font-weight:500}
.fuera .fecha span,.fuera .fecha b,.fuera .name{color:var(--ink-3);font-weight:500}
.was,.falta{margin-top:2px;font-size:13px;font-weight:500;color:var(--ink-3)}
.was s{text-decoration-thickness:1.5px}
.nw{white-space:nowrap}
.txt{background:linear-gradient(currentColor,currentColor) no-repeat 0 60%/0 2px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.name.striking .txt{background-size:100% 2px;transition:background-size .3s var(--ease)}
.entering{animation:entrar .34s var(--ease)}
@keyframes entrar{from{opacity:0;transform:translateY(6px)}}

/* Escala del 1 al 10 de la fila de hoy y de los días sin nota */
.nota{grid-column:1/-1;margin-top:12px}
.who{font-size:13px;font-weight:500;color:var(--ink-2)}
.scale{display:grid;grid-template-columns:repeat(10,1fr);margin-top:2px}
.scale button{display:grid;place-items:center;height:44px}
.scale span{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;font-size:17px;font-weight:600;
  box-shadow:inset 0 0 0 1.5px var(--hair);transition:background-color .18s var(--ease),color .18s var(--ease),transform .12s var(--ease)}
.scale button:active span{transform:scale(.9)}
.scale [aria-pressed="true"] span{background:var(--fill);color:var(--on-fill);box-shadow:none}
.scale button:focus-visible{outline:0}
.scale button:focus-visible span{outline:2px solid var(--tint);outline-offset:2px}
@media (max-width:380px){.scale span{width:28px;height:28px}}
.pareja{margin-top:4px;font-size:15px;color:var(--ink-2)}
.pareja strong{color:var(--ink);font-weight:600}
.acciones{margin-top:12px;font-size:15px}

/* "Comimos otra cosa" */
.otra{grid-column:1/-1;margin-top:14px}
.add{display:flex;align-items:center;gap:8px;height:44px;padding:0 12px;border-radius:9px;background:var(--seg)}
.add:focus-within{outline:2px solid var(--tint);outline-offset:3px}
.add input{flex:1;min-width:0;height:100%;font-size:17px;outline:0}
.add input::placeholder{color:var(--ink-2);opacity:1}
.sugs{display:flex;flex-wrap:wrap;column-gap:20px;margin-top:4px}
.sugs button{min-height:44px;font-size:15px}
.cancel{display:inline-flex;align-items:center;min-height:44px;font-size:15px;font-weight:500;color:var(--ink-2)}
.cancel:active{opacity:.6}

.link{position:relative;color:var(--ink);font-weight:600;text-decoration:underline;text-decoration-thickness:1px;text-decoration-color:var(--rule);text-underline-offset:3px}
.link::before{content:"";position:absolute;inset:-14px -10px}
.link:active{opacity:.6}

.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--bar);border-top:.5px solid var(--hair);padding:6px 8px env(safe-area-inset-bottom)}
.tabs-in{max-width:440px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:58px}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:500;color:var(--ink-3)}
.tab[aria-current="page"]{color:var(--tint-ink)}
.tab svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

@media (prefers-reduced-motion:reduce){*,*::after{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main class="screen">
  <header><h1>Registro</h1></header>
  <div id="diario"></div>
</main>

<nav class="tabs" aria-label="Secciones">
  <div class="tabs-in">
    <a class="tab" href="semana.html"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Semana</a>
    <a class="tab" href="recetas.html"><svg viewBox="0 0 24 24"><path d="M5 4.5h11a3 3 0 0 1 3 3v12H8a3 3 0 0 1-3-3z"/><path d="M5 16.5a3 3 0 0 1 3-3h11"/></svg>Recetas</a>
    <a class="tab" href="lista.html"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6l1 1 2-2M4 12l1 1 2-2"/><circle cx="5" cy="18" r="1"/></svg>Lista</a>
    <a class="tab" aria-current="page" href="registro.html"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M21 20H3"/></svg>Registro</a>
  </div>
</nav>

<script>
const params = new URLSearchParams(location.search);
const tema = params.get('tema');
if (tema === 'claro') document.documentElement.dataset.theme = 'light';
if (tema === 'oscuro') document.documentElement.dataset.theme = 'dark';
document.querySelectorAll('.tab[href$=".html"]').forEach(a => { a.search = location.search; });

// Datos de ejemplo inventados, coherentes con Semana y Recetas (hoy es martes 20 de octubre)
const PLATOS = {curry: 'Pollo al curry con arroz', crema: 'Crema de calabacín y tortilla', garbanzos: 'Garbanzos con espinacas',
  albondigas: 'Albóndigas en salsa', macarrones: 'Macarrones con tomate y atún', salmon: 'Salmón al horno con patatas',
  merluza: 'Merluza en salsa verde', lentejas: 'Lentejas estofadas', arroz: 'Arroz con pollo', pisto: 'Pisto con huevo'};
const NOMBRE_DIA = {L: 'lunes', M: 'martes', X: 'miércoles', J: 'jueves', V: 'viernes', S: 'sábado', D: 'domingo'};
const ACTIVOS = ['L', 'X', 'V'];
// Cada día: letra, número, plato (id de receta) o texto, lo planificado si cambió y las dos notas
const dia = (d, n, plato, tu, pareja, extra = {}) => ({d, n, plato, tu, pareja, texto: null, antes: null, fuera: false, hoy: false, ...extra});
const SEMANAS = [
  {titulo: 'Esta semana', rango: '19–25 oct', dias: [
    dia('M', 20, 'crema', null, null, {hoy: true}),
    dia('L', 19, 'curry', 8, 9)]},
  {titulo: 'Semana pasada', rango: '12–18 oct', dias: [
    dia('D', 18, null, null, null, {fuera: true}),
    dia('S', 17, 'albondigas', null, 9),
    dia('V', 16, null, 7, 7, {texto: 'Sobras de albóndigas', antes: 'garbanzos'}),
    dia('J', 15, 'albondigas', 9, 9),
    dia('X', 14, 'garbanzos', 8, 8),
    dia('M', 13, 'albondigas', 9, 8),
    dia('L', 12, 'garbanzos', 8, 7)]},
  {titulo: 'Del 5 al 11 oct', dias: [
    dia('D', 11, null, null, null, {fuera: true}),
    dia('S', 10, 'salmon', 7, 7),
    dia('V', 9, 'macarrones', 6, 7),
    dia('J', 8, 'salmon', 7, 8),
    dia('X', 7, 'macarrones', 7, 6),
    dia('M', 6, 'salmon', 7, 6),
    dia('L', 5, 'macarrones', 6, 6)]},
  {titulo: 'Del 28 sep al 4 oct', dias: [
    dia('D', 4, null, null, null, {fuera: true}),
    dia('S', 3, 'merluza', 7, 8),
    dia('V', 2, null, null, null, {fuera: true, antes: 'curry'}),
    dia('J', 1, 'merluza', 8, 7),
    dia('X', 30, 'curry', 8, 9),
    dia('M', 29, 'merluza', 7, 8),
    dia('L', 28, 'curry', 8, 8)]},
];

const $ = id => document.getElementById(id);
const sinMovimiento = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
const esc = s => s.replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const llano = s => s.normalize('NFD').replace(/\p{Diacritic}/gu, '').toLowerCase();
const nombre = x => x.fuera ? 'Fuera' : x.texto || PLATOS[x.plato];
const todos = () => SEMANAS.flatMap(s => s.dias);
const hoy = () => todos().find(x => x.hoy);
let abierto = null;      // día cuya escala está desplegada (además de hoy)
let otraAbierta = false; // panel "Comimos otra cosa"
const antesHoy = [];    // copias de hoy para deshacer los cambios, la última al final
let entra = null;

const escala = (x, quien) => `<div class="scale" role="group" aria-label="${quien}">`
  + Array.from({length: 10}, (_, i) => `<button type="button" data-nota="${i + 1}" aria-pressed="${x.tu === i + 1}"`
    + ` aria-label="${i + 1}"><span aria-hidden="true">${i + 1}</span></button>`).join('') + '</div>';

function fila(x, si) {
  const k = `${si}-${x.n}`;
  const notas = x.fuera || (x.hoy && x.tu == null && x.pareja == null) ? '' : `<span class="fig" aria-label="tú ${x.tu ?? 'sin nota'}, tu pareja ${x.pareja ?? 'sin nota'}">`
    + [x.tu, x.pareja].map(v => v == null ? '<i class="no" aria-hidden="true">–</i>' : `<i aria-hidden="true">${v}</i>`).join('') + '</span>';
  const linea = `<div class="line"><span class="name${entra === k ? ' entering' : ''}"><span class="txt">${esc(nombre(x))}</span></span>`
    + (notas ? '<span class="leader" aria-hidden="true"></span>' + notas : '') + '</div>';
  const was = x.antes ? `<p class="was">En lugar de <s>${PLATOS[x.antes]}</s></p>` : '';
  const falta = !x.hoy && !x.fuera && x.tu == null && abierto !== k ? `<p class="falta">Te falta tu nota · <button class="link" type="button" data-puntuar="${k}">Puntuar</button></p>` : '';
  let extra = '';
  const acciones = otraAbierta ? '' : '<p class="acciones">'
    + (antesHoy.length ? '<button class="link" type="button" data-deshacer>Deshacer</button><span aria-hidden="true"> · </span>' : '')
    + '<button class="link" type="button" data-otra>Comimos otra cosa</button></p>';
  if (x.hoy && !x.fuera) {
    extra = `<div class="nota"><p class="who">Tu nota</p>${escala(x, 'Tu nota de hoy')}`
      + `<p class="pareja" aria-live="polite">${x.pareja != null ? `Tu pareja le ha puesto <strong>${x.pareja}</strong>` : 'Tu pareja aún no ha puntuado'}</p>`
      + acciones + '</div>';
  } else if (x.hoy) {
    extra = `<div class="nota">${acciones}</div>`;
  } else if (abierto === k) {
    extra = `<div class="nota"><p class="who">Tu nota del ${NOMBRE_DIA[x.d]} ${x.n}</p>${escala(x, `Tu nota del ${NOMBRE_DIA[x.d]} ${x.n}`)}`
      + '<button class="cancel" type="button" data-cerrar>Cancelar</button></div>';
  }
  if (x.hoy && otraAbierta) extra += panelOtra();
  return `<li class="dia${x.hoy ? ' hoy' : ''}${x.fuera ? ' fuera' : ''}" data-k="${k}">`
    + `<div class="fecha${ACTIVOS.includes(x.d) && !x.fuera ? ' on' : ''}"><b aria-hidden="true">${x.d}</b><span aria-hidden="true">${x.n}</span>`
    + `<span class="sr">${x.hoy ? 'Hoy, ' : ''}${NOMBRE_DIA[x.d]} ${x.n}</span></div>`
    + `<div class="cuerpo">${linea}${was}${falta}</div>${extra}</li>`;
}

// Sugerencias para "Comimos otra cosa": fuera, las sobras de ayer o una receta que coincida
function panelOtra() {
  return `<form class="otra" id="otra"><label class="sr" for="que">¿Qué comisteis?</label>`
    + `<div class="add"><input id="que" type="text" placeholder="¿Qué comisteis?" autocomplete="off" enterkeyhint="done"></div>`
    + `<div class="sugs" id="sugs">${sugerencias('')}</div>`
    + `<button class="cancel" type="button" data-cancelar>Cancelar</button></form>`;
}
function sugerencias(q) {
  const ayer = todos().find(x => !x.hoy && !x.fuera);
  const base = q ? Object.entries(PLATOS).filter(([id, n]) => id !== hoy().plato && llano(n).includes(llano(q))).slice(0, 3).map(([id, n]) => [id, n])
    : [['fuera', 'Fuera'], ['texto', `Sobras de ${nombre(ayer).toLowerCase()}`]];
  if (q && !base.length) base.push(['texto', q[0].toUpperCase() + q.slice(1)]);
  return base.map(([id, n]) => `<button class="link" type="button" data-elige="${id}" data-texto="${esc(n)}">${esc(n)}</button>`).join('');
}

function pintar() {
  $('diario').innerHTML = SEMANAS.map((s, si) => `<h2 class="sec">${s.titulo}${s.rango ? `<small>${s.rango}</small>` : ''}</h2>`
    + `<p class="cols" aria-hidden="true"><span>tú</span><span>pareja</span></p>`
    + `<ul>${s.dias.map(x => fila(x, si)).join('')}</ul>`).join('');
  entra = null;
  guias();
}

// Si el nombre ocupa dos líneas, los puntos guía se alargan hacia la izquierda hasta donde acaba
// la última (solo el trazo: la caja no cambia, así el nombre no se recoloca)
function guias() {
  document.querySelectorAll('#diario .line').forEach(l => {
    const guia = l.querySelector('.leader'), txt = l.querySelector('.txt');
    if (!guia) return;
    const r = document.createRange();
    r.selectNodeContents(txt);
    guia.style.setProperty('--ext', '0px');
    const lineas = r.getClientRects();
    const desde = lineas.length > 1 ? lineas[lineas.length - 1].right + 8 : guia.getBoundingClientRect().left;
    guia.style.setProperty('--ext', Math.max(0, guia.getBoundingClientRect().left - desde) + 'px');
  });
}
new ResizeObserver(guias).observe($('diario'));

// Cambiar lo que se comió hoy: lo planificado se tacha y lo nuevo se escribe en su sitio
function cambiarHoy(id, texto) {
  const x = hoy(), k = `0-${x.n}`;
  const hecho = () => {
    antesHoy.push({...x});
    Object.assign(x, {antes: x.antes || x.plato, plato: id === 'fuera' || id === 'texto' ? null : id,
      texto: id === 'texto' ? texto : null, fuera: id === 'fuera', tu: null, pareja: null});
    if (x.plato === x.antes) Object.assign(x, {antes: null});
    otraAbierta = false;
    entra = k;
    pintar();
  };
  const el = document.querySelector(`[data-k="${k}"] .name`);
  if (sinMovimiento() || !el) return hecho();
  el.classList.add('striking');
  setTimeout(hecho, 340);
}

$('diario').addEventListener('click', e => {
  const t = e.target.closest('button');
  if (!t) return;
  const li = t.closest('[data-k]'), [si, n] = li.dataset.k.split('-').map(Number);
  const x = SEMANAS[si].dias.find(d => d.n === n);
  if (t.dataset.nota) {
    x.tu = +t.dataset.nota;
    if (!x.hoy) abierto = null;
    pintar();
    if (x.hoy) document.querySelector(`[data-k="${li.dataset.k}"] [data-nota="${x.tu}"]`).focus();
  } else if ('puntuar' in t.dataset) { abierto = t.dataset.puntuar; pintar(); document.querySelector(`[data-k="${abierto}"] [data-nota]`).focus(); }
  else if ('otra' in t.dataset) { otraAbierta = true; pintar(); $('que').focus(); }
  else if ('cancelar' in t.dataset) { otraAbierta = false; pintar(); }
  else if ('cerrar' in t.dataset) { abierto = null; pintar(); }
  else if ('elige' in t.dataset) cambiarHoy(t.dataset.elige, t.dataset.texto);
  else if ('deshacer' in t.dataset && antesHoy.length) { Object.assign(x, antesHoy.pop()); entra = li.dataset.k; pintar(); }
});
$('diario').addEventListener('input', e => { if (e.target.id === 'que') $('sugs').innerHTML = sugerencias(e.target.value.trim()); });
$('diario').addEventListener('submit', e => {
  e.preventDefault();
  const q = $('que').value.trim();
  if (!q) return;
  const receta = Object.entries(PLATOS).find(([, n]) => llano(n) === llano(q));
  cambiarHoy(receta ? receta[0] : llano(q) === 'fuera' ? 'fuera' : 'texto', q[0].toUpperCase() + q.slice(1));
});

// Simulación: la nota de tu pareja llega desde su móvil sin recargar
if (params.get('pareja') !== 'no') setTimeout(() => {
  const x = hoy();
  if (x.pareja != null || x.fuera || x.plato !== 'crema') return;
  x.pareja = 7;
  const foco = document.activeElement?.closest('.hoy') && document.activeElement.dataset.nota;
  pintar();
  if (foco) document.querySelector(`.hoy [data-nota="${foco}"]`).focus();
  const p = document.querySelector('.hoy .pareja');
  if (p && !sinMovimiento()) p.animate([{opacity: 0, transform: 'translateY(6px)'}, {opacity: 1, transform: 'none'}], {duration: 340, easing: 'cubic-bezier(.16,1,.3,1)'});
}, 5000);

pintar();
</script>
</body>
</html>
