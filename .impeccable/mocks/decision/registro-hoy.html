<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Registro · Hoy primero</title>
<style>
:root{--ground:#fff;--bar:#f6f6f3;--ink:#1b1f1d;--ink-2:#5c6360;--ink-3:#6b726e;--rule:rgba(27,31,29,.22);--hair:rgba(27,31,29,.14);--tint-ink:#a65200;--fill:#1b1f1d;--on-fill:#fff}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:390px;height:844px;overflow:hidden}
body{position:relative;background:var(--ground);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;font-size:17px;line-height:1.35;font-feature-settings:"tnum" 1}
.status{height:44px;display:flex;justify-content:space-between;align-items:center;padding:0 26px;font-size:15px;font-weight:600}
header{padding:12px 20px 0}
h1{font-size:34px;line-height:1.12;font-weight:700;letter-spacing:-.02em}
.date{margin-top:6px;font-size:15px;color:var(--ink-2)}
.dish{margin:24px 20px 0;font-size:24px;line-height:1.2;font-weight:700;letter-spacing:-.015em}
.meta{margin:4px 20px 0;font-size:15px;color:var(--ink-2)}
.who{margin:22px 20px 0;font-size:13px;font-weight:600;color:var(--ink-2)}
.scale{display:grid;grid-template-columns:repeat(10,1fr);margin:8px 14px 0}
.scale i{font-style:normal;justify-self:center;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:17px;font-weight:600}
.scale i.on{background:var(--fill);color:var(--on-fill)}
.scale.theirs i{color:var(--ink-3);font-weight:500}
.wait{margin:8px 20px 0;font-size:15px;color:var(--ink-2)}
.link{display:inline-block;margin:20px 20px 0;font-size:15px;font-weight:600;text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:3px}
h2{font-size:19px;font-weight:600;letter-spacing:-.01em;margin:30px 20px 2px}
ul{list-style:none}
li{display:flex;align-items:baseline;gap:10px;padding:7px 20px;font-size:15px}
li b{width:14px;font-size:13px;font-weight:600;color:var(--ink-2)}
.leader{flex:1;min-width:32px;border-bottom:2px dotted var(--rule);transform:translateY(-4px)}
.fig{font-weight:600;white-space:nowrap}
.lab{font-size:13px;font-weight:500;color:var(--ink-2);margin:0 4px 0 8px}
.lab:first-child{margin-left:0}
.tabs{position:absolute;left:0;right:0;bottom:0;height:84px;background:var(--bar);border-top:.5px solid var(--hair);display:grid;grid-template-columns:repeat(4,1fr);padding:8px 8px 0}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:500;color:var(--ink-3)}
.tab.on{color:var(--tint-ink)}
.tab svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
<body>
<div class="status"><span>9:41</span><span>100 %</span></div>
<header><h1>Hoy</h1><p class="date">Martes 20 de octubre</p></header>

<p class="dish">Crema de calabacín y tortilla</p>
<p class="meta">Fibra, proteína y grasas</p>
<p class="who">Tu nota</p>
<div class="scale"><i>1</i><i>2</i><i>3</i><i>4</i><i>5</i><i>6</i><i>7</i><i class="on">8</i><i>9</i><i>10</i></div>
<p class="who">Tu pareja</p>
<p class="wait">Aún no ha puntuado</p>
<a class="link">Hoy comimos otra cosa</a>

<h2>Esta semana</h2>
<ul>
  <li><b>L</b><span>Pollo al curry con arroz</span><span class="leader"></span><span class="fig"><span class="lab">tú</span>8<span class="lab">pareja</span>9</span></li>
  <li><b>M</b><span>Crema de calabacín y tortilla</span><span class="leader"></span><span class="fig"><span class="lab">tú</span>8</span></li>
</ul>

<nav class="tabs">
  <a class="tab"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Semana</a>
  <a class="tab"><svg viewBox="0 0 24 24"><path d="M5 4.5h11a3 3 0 0 1 3 3v12H8a3 3 0 0 1-3-3z"/><path d="M5 16.5a3 3 0 0 1 3-3h11"/></svg>Recetas</a>
  <a class="tab"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6l1 1 2-2M4 12l1 1 2-2"/><circle cx="5" cy="18" r="1"/></svg>Lista</a>
  <a class="tab on"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M21 20H3"/></svg>Registro</a>
</nav>
</body>
</html>
